name: gateway-stack

services:
  pg-primary:
    image: bitnamilegacy/postgresql:17.6.0
    environment:
      POSTGRESQL_USERNAME: gateway_admin
      POSTGRESQL_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRESQL_DATABASE: gateway
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: replicator
      POSTGRESQL_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:?POSTGRES_REPLICATION_PASSWORD is required}
      POSTGRESQL_POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    ports:
      # Host port 15432 → container 5432. Using a high port avoids conflicts
      # with a system postgres on 5432. Connect from the IDE at localhost:15432.
      - "127.0.0.1:15432:5432"
    volumes:
      - pg-primary-data:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_ADMIN_PASSWORD} pg_isready -U gateway_admin -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 20

  pg-replica:
    image: bitnamilegacy/postgresql:17.6.0
    environment:
      POSTGRESQL_USERNAME: gateway_admin
      POSTGRESQL_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRESQL_MASTER_HOST: pg-primary
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_REPLICATION_USER: replicator
      POSTGRESQL_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
    ports:
      # Host port 15433 → container 5432. This is the read-only replica;
      # the `spring.r2dbc.url` default in application.yml points here.
      - "127.0.0.1:15433:5432"
    volumes:
      - pg-replica-data:/bitnami/postgresql
    depends_on:
      pg-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_ADMIN_PASSWORD} pg_isready -U gateway_admin"]
      interval: 5s
      timeout: 3s
      retries: 20

  liquibase:
    image: liquibase/liquibase:4.29-alpine
    depends_on:
      pg-primary:
        condition: service_healthy
    volumes:
      - ./liquibase/changelog:/liquibase/changelog:ro
    environment:
      # Connect as the postgres superuser (Bitnami exposes it via
      # POSTGRESQL_POSTGRES_PASSWORD) because changelog 002 needs CREATEROLE,
      # which the default gateway_admin role does not have.
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://pg-primary:5432/gateway
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: changelog/db.changelog-master.xml
      # The changelog references ${gateway_reader_password}; Liquibase resolves
      # that against JVM system properties, so pass it via JAVA_OPTS.
      JAVA_OPTS: "-Dgateway_reader_password=${GATEWAY_READER_PASSWORD:?GATEWAY_READER_PASSWORD is required}"
    command: ["update"]
    restart: "no"

  casdoor:
    # casbin/casdoor-all-in-one bundles Casdoor + an internal MySQL so no
    # external DB is needed. The gateway uses this at OIDC discovery time
    # (startup) to build its ClientRegistrationRepository. For a real browser
    # login flow, you'd need to also create a Casdoor application matching
    # CASDOOR_CLIENT_ID / CASDOOR_CLIENT_SECRET in the Casdoor admin UI at
    # http://localhost:8000 (default login: built-in/admin / 123).
    image: casbin/casdoor-all-in-one:latest
    ports:
      # Default binds to loopback only — the Casdoor all-in-one image ships
      # with `built-in/admin` / `123` as its default login, and exposing it
      # to the public internet (e.g. on a DigitalOcean Droplet) during a
      # verification run is a live fire drill we do not want. Opt in to
      # external access by setting CASDOOR_BIND_HOST=0.0.0.0 in .env.
      - "${CASDOOR_BIND_HOST:-127.0.0.1}:8000:8000"
    healthcheck:
      # The Casdoor all-in-one image is Debian-based but has neither curl nor
      # wget. Bash is present, so we use bash's /dev/tcp pseudo-device to
      # probe the HTTP port. This confirms the embedded MySQL and Casdoor
      # are both up (Casdoor doesn't bind 8000 until MySQL is reachable).
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/localhost/8000'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  casdoor-bootstrap:
    # One-shot service that registers the snapdragon-id-gateway OAuth2 client
    # in the running Casdoor instance via its admin REST API. Uses the
    # `curlimages/curl` image (no shell, so we run curl inside busybox sh via
    # the alpine/curl mirror — see entrypoint). Idempotent on re-runs.
    image: alpine/curl:latest
    depends_on:
      casdoor:
        condition: service_healthy
    volumes:
      - ./scripts/bootstrap-casdoor.sh:/bootstrap-casdoor.sh:ro
    environment:
      CASDOOR_URL: http://casdoor:8000
      CASDOOR_ADMIN_USERNAME: ${CASDOOR_ADMIN_USERNAME:-admin}
      CASDOOR_ADMIN_PASSWORD: ${CASDOOR_ADMIN_PASSWORD:-123}
      CASDOOR_CLIENT_ID: ${CASDOOR_CLIENT_ID:?CASDOOR_CLIENT_ID is required}
      CASDOOR_CLIENT_SECRET: ${CASDOOR_CLIENT_SECRET:?CASDOOR_CLIENT_SECRET is required}
      GATEWAY_REDIRECT_URI: ${CASDOOR_REDIRECT_URI:-http://localhost:8080/login/oauth2/code/casdoor}
    entrypoint: ["sh", "/bootstrap-casdoor.sh"]
    restart: "no"

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      liquibase:
        condition: service_completed_successfully
      pg-replica:
        condition: service_healthy
      casdoor:
        condition: service_healthy
      casdoor-bootstrap:
        condition: service_completed_successfully
    environment:
      # Activate the casdoor profile so OAuth2ClientConfig builds a
      # ReactiveClientRegistrationRepository by fetching OIDC discovery from
      # the real Casdoor instance. Startup fails fast if Casdoor is unreachable.
      SPRING_PROFILES_ACTIVE: casdoor
      SPRING_R2DBC_URL: r2dbc:postgresql://pg-replica:5432/gateway
      SPRING_R2DBC_USERNAME: gateway_reader
      SPRING_R2DBC_PASSWORD: ${GATEWAY_READER_PASSWORD}
      CASDOOR_ISSUER_URI: ${CASDOOR_ISSUER_URI:?CASDOOR_ISSUER_URI is required}
      CASDOOR_CLIENT_ID: ${CASDOOR_CLIENT_ID:?CASDOOR_CLIENT_ID is required}
      CASDOOR_CLIENT_SECRET: ${CASDOOR_CLIENT_SECRET:?CASDOOR_CLIENT_SECRET is required}
      GATEWAY_ROUTES_REFRESH_INTERVAL: ${GATEWAY_ROUTES_REFRESH_INTERVAL:-30s}
    ports:
      # Default binds to loopback only; set GATEWAY_BIND_HOST=0.0.0.0 in .env
      # to expose the gateway on the host's public interfaces. On a
      # publicly-reachable host (e.g. DigitalOcean Droplet), prefer to front
      # the gateway with an existing reverse proxy + TLS terminator rather
      # than exposing 8080 directly.
      - "${GATEWAY_BIND_HOST:-127.0.0.1}:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pg-primary-data:
  pg-replica-data:
