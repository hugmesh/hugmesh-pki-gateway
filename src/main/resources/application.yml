spring:
  application:
    name: snapdragon-id-gateway

  r2dbc:
    # Default URL targets the replica's published host port (15433) for IDE dev.
    # Inside docker-compose, SPRING_R2DBC_URL overrides to pg-replica:5432.
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:15433/gateway}
    username: ${SPRING_R2DBC_USERNAME:gateway_reader}
    password: ${SPRING_R2DBC_PASSWORD:changeme}
    pool:
      initial-size: 2
      max-size: 10

  # ── OAuth2 client + resource server ─────────────────────────────────
  # Casdoor wiring is now CONFIGURATION-DRIVEN. The previous design
  # had profile-gated @Bean methods reading CASDOOR_ISSUER_URI /
  # CASDOOR_CLIENT_ID / CASDOOR_CLIENT_SECRET in OAuth2ClientConfig.
  # Moving the wiring here means:
  #   1. Every deployment's identity (issuer URI, client id, scopes)
  #      lives in this repo's deploy artefacts (compose env file,
  #      k8s ConfigMap, .env) — not in compiled Java.
  #   2. Spring Security's built-in registration loader handles OIDC
  #      discovery automatically — same code path snapdragon.games
  #      uses for its resource-server JWT validation.
  #
  # The `local` profile (used by tests) still drives an in-process
  # MockOAuth2Server — see OAuth2ClientConfig.java for the mock-only
  # bean; that profile overrides the registration URIs below at
  # runtime to point at the mock server's random port.
  security:
    oauth2:
      # ─ Client (oauth2Login) ─────────────────────────────────────
      # The id-gateway initiates the OAuth Authorization Code flow.
      # Users land at /login/oauth2/authorization/casdoor and get
      # redirected to Casdoor; after the callback they hold an OIDC
      # session here, and TokenRelay forwards the access token to
      # downstream services.
      client:
        registration:
          casdoor:
            provider: casdoor
            client-id:     ${CASDOOR_CLIENT_ID:snapdragon-id-gateway}
            client-secret: ${CASDOOR_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
            client-name: Casdoor
        provider:
          casdoor:
            # Spring resolves the issuer URI's well-known config
            # lazily on the first login — boot doesn't block on
            # Casdoor reachability. Mirrors snapdragon.games' BFF
            # spring.security.oauth2.resourceserver.jwt.issuer-uri.
            issuer-uri: ${CASDOOR_ISSUER_URI:http://casdoor:8000}
            user-name-attribute: sub

      # ─ Resource server (JWT validation) ─────────────────────────
      # In parallel with the client wiring, the gateway also acts as
      # a resource server: requests carrying a Bearer token issued
      # by Casdoor are validated here (signature + iss + exp) and
      # the principal's roles + permissions become Spring authorities
      # via CasdoorAuthoritiesConverter (config code, not yaml,
      # because the conversion is a code contract). This mirrors
      # the snapdragon.games BFF — same Casdoor instance, same
      # JWT decoder, same authority shape, so a JWT validated here
      # is recognised downstream without re-validation.
      resourceserver:
        jwt:
          issuer-uri:  ${CASDOOR_ISSUER_URI:http://casdoor:8000}
          jwk-set-uri: ${CASDOOR_JWKS_URI:${CASDOOR_ISSUER_URI:http://casdoor:8000}/.well-known/jwks}

  cloud:
    gateway:
      # All routes come from DbRouteDefinitionLocator (Postgres). No static routes.
      default-filters: []

gateway:
  routes:
    refresh-interval: ${GATEWAY_ROUTES_REFRESH_INTERVAL:30s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,refresh
  endpoint:
    gateway:
      access: read_only
    health:
      show-details: when-authorized
      # Detailed health is restricted to game-master tokens —
      # leaks cluster state (Postgres replica reachability, route
      # count, Casdoor discovery cache status). Aligns with the
      # snapdragon-games-gateway policy in SecurityConfig.
      roles: GAME-MASTER

logging:
  level:
    "[org.springframework.cloud.gateway]": INFO
    "[systems.snapdragon.gateway]": DEBUG
