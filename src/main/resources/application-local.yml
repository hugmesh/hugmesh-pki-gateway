# Profile: local
#
# Runs the gateway against an in-process H2 database and an in-process mock
# OAuth2 client registration (see OAuth2ClientConfig#localClientRegistrationRepository).
# No external services required — useful for IDE-driven dev of routes, DB,
# actuator, and refresh logic. Actual OAuth2 login flows won't complete
# because the mock URIs point at a non-existent local server; that's
# intentional — the `casdoor` profile is the one that drives real auth.

spring:
  r2dbc:
    # Shared in-memory H2 database. DB_CLOSE_DELAY=-1 keeps it alive as long
    # as the JVM is up (so schema survives between connections from the pool).
    url: r2dbc:h2:mem:///gateway?DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    pool:
      initial-size: 2
      max-size: 10

  sql:
    init:
      # Spring Boot runs the schema + data SQL via the R2DBC connection
      # factory at startup, before any @Bean that uses the ConnectionFactory
      # needs to resolve a connection.
      mode: always
      schema-locations: classpath:sql/h2-schema.sql
      data-locations: classpath:sql/h2-data.sql
