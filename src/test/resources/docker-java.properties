# Workaround for docker-java / Testcontainers 1.21.x vs Docker Engine 29+:
# docker-java ships with api.version=1.32 by default, which Docker 29 rejects
# (minimum accepted API version was raised to 1.44).
#
# Testcontainers 2.0.2+ fixes this upstream. Until then, this file pins the
# API version used by the test classpath to something the server accepts.
# See: https://github.com/testcontainers/testcontainers-java/issues/11210
api.version=1.47
