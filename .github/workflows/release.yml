name: Release

# Manual-only. This workflow is intentionally inert until a human enables it —
# no push/tag trigger. Mirrors the build this repo's .gitlab-ci.yml performs
# (docker build off the sibling hugmesh-gateway image via the GATEWAY_IMAGE
# build-arg), but publishes to GHCR instead of the in-cluster GitLab registry.
on:
  workflow_dispatch:
    inputs:
      gateway_image:
        description: >
          Sibling hugmesh-gateway base image (GATEWAY_IMAGE build-arg) this
          overlay builds FROM.
        required: false
        default: ghcr.io/hugmesh/hugmesh-gateway:main
      tag:
        description: Tag to publish the built image under.
        required: false
        default: latest

env:
  IMAGE_NAME: ghcr.io/hugmesh/hugmesh-pki-gateway

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GATEWAY_IMAGE=${{ inputs.gateway_image }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
